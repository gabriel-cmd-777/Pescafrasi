<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pescafrasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#f3ede0; --paper2:#eae2d0; --ink:#241f18; --rule:#cdbfa0; --pencil:#a13d2f; --pencil2:#7a8c6f; --dim:#8a7f68;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#161410; --paper2:#1e1b15; --ink:#ece5d4; --rule:#413a2c; --pencil:#e2896e; --pencil2:#9fb391; --dim:#948a70;}
}
:root[data-theme="dark"]{--paper:#161410; --paper2:#1e1b15; --ink:#ece5d4; --rule:#413a2c; --pencil:#e2896e; --pencil2:#9fb391; --dim:#948a70;}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--paper);color:var(--ink);}
body{
  font-family:"Cormorant Garamond",Georgia,serif;line-height:1.55;
  padding:2.5rem 1.4rem 4rem;max-width:640px;margin:0 auto;
  background-image:radial-gradient(ellipse at top,var(--paper2) 0%,var(--paper) 60%);
}
h1{font-size:2rem;font-weight:600;letter-spacing:.01em;margin:0;display:flex;align-items:baseline;gap:.5rem;}
h1 .rod{font-size:1.1rem;}
.sub{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.68rem;letter-spacing:.03em;text-transform:uppercase;color:var(--dim);margin:.4rem 0 2.2rem;}
section{border-top:1px dashed var(--rule);padding:1.3rem 0;}
section:first-of-type{border-top:none;}
label{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.68rem;letter-spacing:.02em;color:var(--dim);margin-bottom:.5rem;}
textarea,input[type=text]{width:100%;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.82rem;background:var(--paper2);color:var(--ink);border:1px solid var(--rule);padding:.6rem .7rem;border-radius:6px;}
textarea{min-height:4.5rem;resize:vertical;}
input[type=file]{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.75rem;color:var(--dim);width:100%;}
button{
  font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;
  background:var(--paper2);color:var(--ink);border:1px solid var(--ink);
  padding:.55rem 1rem;border-radius:999px;cursor:pointer;margin:.3rem .5rem .3rem 0;
  transition:background .15s ease,color .15s ease,transform .1s ease;
}
button:hover:not(:disabled){background:var(--ink);color:var(--paper);}
button:active:not(:disabled){transform:scale(.96);}
button:disabled{opacity:.3;cursor:default;}
button.ghost{border-color:var(--rule);color:var(--dim);background:transparent;}
.status{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.68rem;color:var(--dim);margin:.7rem 0;min-height:1em;}
.stage{
  font-size:1.35rem;padding:1.4rem 1.5rem;margin-top:.8rem;min-height:3em;
  background:var(--paper2);border:1px solid var(--rule);border-left:4px solid var(--pencil);
  border-radius:4px 10px 10px 4px;box-shadow:0 6px 18px -12px rgba(0,0,0,.35);
}
.stage b{color:var(--pencil);font-weight:600;font-style:normal;}
.stage.empty{color:var(--dim);font-style:italic;font-size:1rem;border-left-color:var(--rule);box-shadow:none;}
@keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
.stage.fadein{animation:fadein .35s ease;}
.accum{font-size:1.08rem;margin:.5rem 0 0;}
.accum p{position:relative;margin:0 0 1.7em;padding:.1em 1.4em .1em .9em;border-left:2px solid var(--rule);}
.accum p b{color:var(--pencil);font-weight:600;}
.accum p .rm{position:absolute;right:0;top:.15em;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.62rem;color:var(--dim);text-decoration:none;opacity:.4;}
.accum p .rm:hover{opacity:1;color:var(--pencil);}
.accum p .src{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.62rem;color:var(--dim);margin-top:.35em;}
#library{border-left:none;}
#library p{margin:0 0 .3em;padding:0 1.4em 0 0;border-left:none;}
#library .rm{opacity:.6;}
.rowflex{display:flex;gap:.5rem;align-items:flex-start;flex-wrap:wrap;}
.count{color:var(--dim);}
</style>
</head>
<body>

<h1><span class="rod">🎣</span> Pescafrasi</h1>
<p class="sub">estrazione &amp; sostituzione seriale da EPUB</p>

<section id="cfg">
  <label>coppie parola-target → sostituto — una per riga, formato "originale &gt; sostituto"</label>
  <textarea id="pairs" placeholder="cosa &gt; poesia&#10;cose &gt; poesie"></textarea>
  <div class="rowflex" style="margin-top:.5rem;">
    <button id="savecfg">salva coppie</button>
    <span class="status" id="cfgstatus"></span>
  </div>
</section>

<section id="upload">
  <label>carica uno o più file EPUB — restano salvati nel browser</label>
  <input type="file" id="epubs" accept=".epub" multiple>
  <div class="status" id="loadstatus"></div>
  <div class="accum" id="library" style="font-size:.78rem;"></div>
</section>

<section id="fish">
  <div class="rowflex">
    <button id="pesca" disabled>pesca una frase</button>
    <button id="sost" disabled>sostituisci</button>
    <button id="salva" disabled>salva</button>
  </div>
  <div class="stage empty" id="stage">carica gli EPUB e imposta almeno una coppia per iniziare.</div>
</section>

<section id="saved">
  <label>frasi salvate (<span id="savedcount">0</span>)</label>
  <div class="accum" id="savedlist"></div>
  <div class="rowflex" style="margin-top:.6rem;">
    <button class="ghost" id="exportbtn">esporta .docx</button>
    <button class="ghost" id="clearbtn">svuota</button>
  </div>
</section>

<script>
const $=id=>document.getElementById(id);
let pairs=[]; // [{orig, sub}]
let pool=[]; // [{text, matchWord, pairIdx}]
let current=null; // {text, matchWord, pairIdx, substituted}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function loadCfg(){
  try{
    const raw=localStorage.getItem('pescafrasi_pairs');
    if(raw){ $('pairs').value=raw; parsePairs(); }
  }catch(e){}
}
function parsePairs(){
  const lines=$('pairs').value.split('\n').map(l=>l.trim()).filter(Boolean);
  pairs=lines.map(l=>{
    const [o,s]=l.split('>').map(x=>x.trim());
    return {orig:o, sub:s};
  }).filter(p=>p.orig && p.sub);
  updateFishState();
}
$('savecfg').onclick=()=>{
  parsePairs();
  try{ localStorage.setItem('pescafrasi_pairs', $('pairs').value); }catch(e){}
  $('cfgstatus').textContent = pairs.length ? pairs.length+' coppie attive' : 'nessuna coppia valida';
  rebuildPool();
};

function wordRegex(word){
  return new RegExp('(?<![A-Za-zÀ-ÿ])('+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![A-Za-zÀ-ÿ])','i');
}
function wordRegexG(word){
  return new RegExp('(?<![A-Za-zÀ-ÿ])('+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![A-Za-zÀ-ÿ])','gi');
}
function tokenize(text){
  const words=[]; const re=/\S+/g; let m;
  while((m=re.exec(text))) words.push({start:m.index, end:m.index+m[0].length});
  return words;
}
// Ritaglia il testo a una finestra di massimo ~100 parole attorno alla parola trovata,
// garantendo che quella parola non sia mai l'ultima della finestra (né dell'estratto)
function buildWindow(text, words, matchIndex){
  let wi=-1;
  for(let k=0;k<words.length;k++){ if(matchIndex>=words[k].start && matchIndex<words[k].end){ wi=k; break; } }
  if(wi===-1) return null;
  const availAfter = words.length-1-wi;
  if(availAfter<1) return null; // la parola sarebbe l'ultima: scartata
  const TOTAL=100;
  let after = Math.min(availAfter, Math.max(3, Math.round(TOTAL*0.35)));
  let before = Math.min(wi, Math.max(0, TOTAL-1-after));
  let used = before+1+after;
  if(used<TOTAL){
    const extra = Math.min(TOTAL-used, words.length-1-(wi+after));
    after += extra;
  }
  const startIdx=wi-before, endIdx=wi+after;
  let snippet = text.slice(words[startIdx].start, words[endIdx].end);
  if(startIdx>0) snippet='…'+snippet;
  if(endIdx<words.length-1) snippet=snippet+'…';
  return snippet;
}

function hashText(s){
  let h=5381;
  for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0;
  return h.toString(36);
}

function loadShown(){
  try{ return new Set(JSON.parse(localStorage.getItem('pescafrasi_shown')||'[]')); }catch(e){ return new Set(); }
}
let shown = loadShown();
function markShown(hash){
  shown.add(hash);
  try{ localStorage.setItem('pescafrasi_shown', JSON.stringify([...shown])); }catch(e){}
}

// --- libreria EPUB persistente (IndexedDB) ---
function openLibDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('pescafrasiLib',1);
    req.onupgradeneeded=e=>{ e.target.result.createObjectStore('epubs'); };
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>rej(e);
  });
}
async function libPut(name, buf){
  const db=await openLibDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('epubs','readwrite');
    tx.objectStore('epubs').put(buf,name);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
async function libDelete(name){
  const db=await openLibDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('epubs','readwrite');
    tx.objectStore('epubs').delete(name);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
async function libGetAll(){
  const db=await openLibDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('epubs','readonly');
    const store=tx.objectStore('epubs');
    const kreq=store.getAllKeys();
    kreq.onsuccess=()=>{
      const keys=kreq.result;
      const vreq=store.getAll();
      vreq.onsuccess=()=> res(keys.map((k,i)=>({name:k, buf:vreq.result[i]})));
      vreq.onerror=()=>rej(vreq.error);
    };
    kreq.onerror=()=>rej(kreq.error);
  });
}

function renderLibrary(names){
  $('library').innerHTML = names.length ? names.map(n=>
    '<p>'+esc(n)+' <a class="rm" href="#" data-n="'+esc(n)+'">rimuovi</a></p>'
  ).join('') : '';
}
$('library').addEventListener('click', async e=>{
  if(e.target.classList.contains('rm')){
    e.preventDefault();
    await libDelete(e.target.dataset.n);
    await reloadLibrary();
  }
});

// Estrae paragrafi da un blocco di testo (gestisce sia <p> separati sia un unico
// blocco con <br> multipli, comune in molti EPUB convertiti male)
function extractParas(doc, source, out){
  const blocks = [...doc.querySelectorAll('p,div,li,blockquote')]
    .filter(el=>!el.querySelector('p,div,li,blockquote'));
  for(const el of blocks){
    const parts = el.innerHTML.split(/<br\s*\/?\s*>/i);
    for(const part of parts){
      const tmp=document.createElement('div');
      tmp.innerHTML=part;
      const t=tmp.textContent.replace(/\s+/g,' ').trim();
      if(t.length>15) out.push({text:t, source});
    }
  }
}

async function parseEpubBuffer(buf, name){
  const zip = await JSZip.loadAsync(buf);
  const paras=[];
  const names = Object.keys(zip.files).filter(n=>/\.(xhtml|html|htm)$/i.test(n));
  for(const fname of names){
    const raw = await zip.files[fname].async('string');
    let doc;
    try{ doc = new DOMParser().parseFromString(raw,'application/xhtml+xml'); }
    catch(e){ doc = null; }
    if(!doc || doc.querySelector('parsererror')) doc = new DOMParser().parseFromString(raw,'text/html');
    extractParas(doc, name, paras);
  }
  return paras;
}

let allParas=[];
async function reloadLibrary(){
  $('loadstatus').textContent='lettura libreria…';
  const items = await libGetAll();
  renderLibrary(items.map(i=>i.name));
  allParas=[];
  for(const it of items){
    try{ allParas = allParas.concat(await parseEpubBuffer(it.buf, it.name)); }
    catch(e){ /* file corrotto: ignora */ }
  }
  $('loadstatus').textContent = items.length
    ? allParas.length+' paragrafi letti da '+items.length+' file in libreria.'
    : 'nessun EPUB in libreria.';
  rebuildPool();
}

$('epubs').onchange=async (e)=>{
  const files=[...e.target.files];
  if(!files.length) return;
  $('loadstatus').textContent='salvataggio in corso…';
  for(const f of files){
    try{ await libPut(f.name, await f.arrayBuffer()); }
    catch(err){ $('loadstatus').textContent='errore salvando '+f.name+'.'; return; }
  }
  e.target.value='';
  await reloadLibrary();
};

function rebuildPool(){
  pool=[];
  if(!pairs.length || !allParas.length){ updateFishState(); return; }
  let skipped=0;
  for(const para of allParas){
    const words = tokenize(para.text);
    for(let i=0;i<pairs.length;i++){
      const re=wordRegexG(pairs[i].orig);
      let m;
      while((m=re.exec(para.text))){
        const snippet = buildWindow(para.text, words, m.index);
        if(!snippet) continue;
        const h=hashText(snippet);
        if(shown.has(h)){ skipped++; continue; }
        pool.push({text:snippet, matchWord:m[0], pairIdx:i, source:para.source, hash:h});
      }
    }
  }
  $('loadstatus').textContent = pool.length+' frasi pronte da pescare'+(skipped?' ('+skipped+' già proposte in passato)':'')+'.';
  updateFishState();
}

function updateFishState(){
  $('pesca').disabled = pool.length===0;
}

$('pesca').onclick=()=>{
  const idx = Math.floor(Math.random()*pool.length);
  const item = pool[idx];
  current = {text:item.text, matchWord:item.matchWord, pairIdx:item.pairIdx, source:item.source, substituted:false};
  markShown(item.hash);
  pool.splice(idx,1);
  render();
  $('sost').disabled=false;
  $('salva').disabled=false;
  updateFishState();
  if(pool.length===0) $('loadstatus').textContent='nessun altro paragrafo nuovo disponibile in questa sessione.';
};

function render(){
  const stage=$('stage');
  stage.classList.remove('empty');
  stage.classList.remove('fadein'); void stage.offsetWidth; stage.classList.add('fadein');
  const re=wordRegex(current.substituted ? pairs[current.pairIdx].sub : current.matchWord);
  const displayed = current.substituted
    ? current.text.replace(wordRegex(current.matchWord), pairs[current.pairIdx].sub)
    : current.text;
  const html = esc(displayed).replace(re, m=>'<b>'+m+'</b>');
  stage.innerHTML = html;
}

$('sost').onclick=()=>{
  if(!current || current.substituted) return;
  current.substituted=true;
  render();
};

function loadSaved(){
  try{
    const raw=JSON.parse(localStorage.getItem('pescafrasi_saved')||'[]');
    return raw.map(x=> typeof x==='string' ? {text:x, source:'—'} : x);
  }catch(e){ return []; }
}
function persistSaved(list){
  try{ localStorage.setItem('pescafrasi_saved', JSON.stringify(list)); }catch(e){}
}
function renderSaved(){
  const list=loadSaved();
  $('savedcount').textContent=list.length;
  $('savedlist').innerHTML = list.map((s,i)=>{
    const body = s.bold ? esc(s.text).replace(wordRegex(s.bold), m=>'<b>'+m+'</b>') : esc(s.text);
    return '<p>'+body+'<span class="src">'+esc(s.source)+'</span><a class="rm" href="#" data-i="'+i+'">rimuovi</a></p>';
  }).join('');
}
$('savedlist').addEventListener('click',e=>{
  if(e.target.classList.contains('rm')){
    e.preventDefault();
    const i=+e.target.dataset.i;
    const list=loadSaved();
    list.splice(i,1);
    persistSaved(list);
    renderSaved();
  }
});
$('salva').onclick=()=>{
  if(!current) return;
  const activeWord = current.substituted ? pairs[current.pairIdx].sub : current.matchWord;
  const finalText = current.substituted
    ? current.text.replace(wordRegex(current.matchWord), pairs[current.pairIdx].sub)
    : current.text;
  const list=loadSaved();
  list.push({text:finalText, source:current.source, bold:activeWord});
  persistSaved(list);
  renderSaved();
};
function xmlEsc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function docxPara(text, opts){
  opts = opts || {};
  const spacing = opts.spacing!=null ? opts.spacing : 240;
  let run = '<w:r><w:t xml:space="preserve">'+xmlEsc(text)+'</w:t></w:r>';
  if(opts.supNum!=null){
    run += '<w:r><w:rPr><w:vertAlign w:val="superscript"/></w:rPr><w:t>'+opts.supNum+'</w:t></w:r>';
  }
  let rPr='';
  if(opts.bold) rPr='<w:rPr><w:b/></w:rPr>';
  if(opts.small) rPr='<w:rPr><w:sz w:val="18"/></w:rPr>';
  if(rPr){ run = run.replace('<w:r>','<w:r>'+rPr); }
  return '<w:p><w:pPr><w:spacing w:after="'+spacing+'"/></w:pPr>'+run+'</w:p>';
}
async function buildDocx(list){
  const body = list.map((s,i)=> docxPara(s.text, {supNum:i+1, spacing:240})).join('');
  const heading = docxPara('Fonti', {bold:true, spacing:160});
  const notes = list.map((s,i)=> docxPara((i+1)+'. '+s.source, {small:true, spacing:60})).join('');
  const documentXml =
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
'<w:body>'+body+heading+notes+'<w:sectPr/></w:body></w:document>';
  const contentTypes =
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
'<Default Extension="xml" ContentType="application/xml"/>'+
'<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
'</Types>';
  const rootRels =
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'+
'</Relationships>';
  const zip = new JSZip();
  zip.file('[Content_Types].xml', contentTypes);
  zip.folder('_rels').file('.rels', rootRels);
  zip.folder('word').file('document.xml', documentXml);
  return await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
$('exportbtn').onclick=async ()=>{
  const list=loadSaved();
  if(!list.length) return;
  $('exportbtn').disabled=true;
  const prevLabel=$('exportbtn').textContent;
  $('exportbtn').textContent='genero…';
  try{
    const blob = await buildDocx(list);
    let cap=null;
    try{ cap = window.claude ? await window.claude.use('downloads') : null; }catch(e){ cap=null; }
    if(cap){
      try{
        await cap.save({filename:'pescafrasi.docx', data:blob});
      }catch(err){
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob); a.download='pescafrasi.docx'; a.click();
      }
    } else {
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='pescafrasi.docx'; a.click();
    }
  } finally {
    $('exportbtn').disabled=false;
    $('exportbtn').textContent=prevLabel;
  }
};
$('clearbtn').onclick=()=>{
  if(confirm('Svuotare tutte le frasi salvate?')){
    persistSaved([]);
    renderSaved();
  }
};

loadCfg();
renderSaved();
reloadLibrary();
</script>
</body>
</html>
